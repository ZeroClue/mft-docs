<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="800" height="500" fill="#1e1e2e" rx="12"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="800" height="44" fill="#313244" rx="12"/>
  <rect x="0" y="32" width="800" height="20" fill="#313244"/>

  <!-- Traffic Light Buttons -->
  <circle cx="28" cy="22" r="8" fill="#f38ba8"/>
  <circle cx="52" cy="22" r="8" fill="#fab387"/>
  <circle cx="76" cy="22" r="8" fill="#a6e3a1"/>

  <!-- Terminal Title -->
  <text x="400" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4" text-anchor="middle">mftctl</text>

  <!-- Terminal Content -->
  <g font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="14">

    <!-- Prompt 1: Login -->
    <text x="24" y="80" fill="#a6e3a1">➜</text>
    <text x="44" y="80" fill="#89b4fa">~</text>
    <text x="60" y="80" fill="#cdd6f4">mftctl login</text>

    <!-- Output 1 -->
    <text x="24" y="110" fill="#a6e3a1">✓</text>
    <text x="44" y="110" fill="#cdd6f4">Authenticated as admin@mftplus.co.za</text>

    <!-- Prompt 2 -->
    <text x="24" y="150" fill="#a6e3a1">➜</text>
    <text x="44" y="150" fill="#89b4fa">~</text>
    <text x="60" y="150" fill="#cdd6f4">mftctl agents list</text>

    <!-- Output 2 -->
    <text x="24" y="180" fill="#cdd6f4">  ag-2x8mK9nR  prod-server-01   online</text>
    <text x="24" y="200" fill="#cdd6f4">  ag-7hJ3pL2q  staging-server   online</text>
    <text x="24" y="220" fill="#cdd6f4">  ag-4mB9vC5x  dr-replica       offline</text>

    <!-- Prompt 3 -->
    <text x="24" y="260" fill="#a6e3a1">➜</text>
    <text x="44" y="260" fill="#89b4fa">~</text>
    <text x="60" y="260" fill="#cdd6f4">mftctl transfers create --agent ag-2x8mK9nR \</text>
    <text x="60" y="280" fill="#cdd6f4">  --source /var/log/app/*.log \</text>
    <text x="60" y="300" fill="#cdd6f4">  --dest sftp://backup.example.com/logs</text>

    <!-- Output 3 -->
    <text x="24" y="330" fill="#a6e3a1">✓</text>
    <text x="44" y="330" fill="#cdd6f4">Transfer created: tr-abc123</text>

    <!-- Animated Progress Bar -->
    <rect x="24" y="350" width="200" height="8" fill="#313244" rx="4"/>
    <rect x="24" y="350" width="140" height="8" fill="#89b4fa" rx="4"/>

    <!-- Transfer Stats -->
    <text x="24" y="380" fill="#89b4fa" font-weight="bold">Status:</text>
    <text x="80" y="380" fill="#cdd6f4">transferring</text>
    <text x="400" y="380" fill="#a6e3a1">70%</text>

    <!-- Prompt 4 (blinking cursor) -->
    <text x="24" y="450" fill="#a6e3a1">➜</text>
    <text x="44" y="450" fill="#89b4fa">~</text>
    <rect x="60" y="438" width="10" height="18" fill="#cdd6f4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Subtle glow effect -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#89b4fa" stroke-width="2" rx="12" opacity="0.3"/>
</svg>
